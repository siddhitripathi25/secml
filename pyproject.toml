[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secml"
version = "0.1.0"
description = "AI/ML-Powered Behavioral Security Analyzer for the Terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "psutil",
    "numpy",
    "pandas",
    "scikit-learn",
    "pytest",
]

[project.scripts]
secml = "secml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
