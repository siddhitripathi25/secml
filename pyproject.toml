[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secml"
version = "0.1.0"
description = "AI/ML-Powered Behavioral Security Analyzer for the Terminal"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Siddhi Tripathi" }
]
license = { text = "MIT License" }
keywords = ["security", "machine-learning", "anomaly-detection", "cli", "terminal", "behavioral-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "typer",
    "rich",
    "psutil",
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/siddhitripathi25/secml"
Repository = "https://github.com/siddhitripathi25/secml.git"

[project.scripts]
secml = "secml.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "data*"]
